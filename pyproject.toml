[project]
name = "skillscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdurahman Mohammed", email = "abdurahmanmoh.3@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "lab>=8.10",
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[project.scripts]
skillscope = "skillscope:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
